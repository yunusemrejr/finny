[package]
name = "finny"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "finny"
path = "src/main.rs"

[dependencies]
# --- Native GUI (replaces actix-web + browser) ---
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# --- Finance engine (verbatim reuse) deps ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
regex = "1"
anyhow = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
